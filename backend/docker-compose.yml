version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_SOURCE_BUCKET=${SUPABASE_SOURCE_BUCKET:-source-files}
      - SUPABASE_DOCS_BUCKET=${SUPABASE_DOCS_BUCKET:-generated-docs}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - DOCUMENT_TTL_HOURS=${DOCUMENT_TTL_HOURS:-2}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: rq worker --url redis://redis:6379 worksheet-generation cleanup
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_SOURCE_BUCKET=${SUPABASE_SOURCE_BUCKET:-source-files}
      - SUPABASE_DOCS_BUCKET=${SUPABASE_DOCS_BUCKET:-generated-docs}
      - DOCUMENT_TTL_HOURS=${DOCUMENT_TTL_HOURS:-2}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
